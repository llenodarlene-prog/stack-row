name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stack-row-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci && BUILD_ENV=staging npm run verify
      - name: Confirm the staging target
        env:
          STAGING_URL: ${{ vars.SITE_URL }}
        run: node scripts/check-staging-target.mjs
      - name: Deploy document root
        run: bash scripts/deploy-document-root.sh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_REQUIRE_SUFFIX: /staging
      - run: node scripts/smoke-test.mjs
        env:
          SMOKE_URL: ${{ vars.SITE_URL }}
          SMOKE_BRAND: ${{ vars.SITE_NAME }}
          SMOKE_EXPECT_ROBOTS: noindex
