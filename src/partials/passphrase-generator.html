<form class="calc-form" novalidate>
  <div class="calc-grid">
    <div class="calc-field"><label for="pp-words">Number of words</label><select id="pp-words" name="words"><option>3</option><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></div>
    <div class="calc-field"><label for="pp-sep">Separator</label><select id="pp-sep" name="separator"><option value="hyphen">Hyphen (-)</option><option value="space">Space</option><option value="period">Period (.)</option><option value="underscore">Underscore (_)</option><option value="comma">Comma (,)</option><option value="none">None</option></select></div>
    <div class="calc-field"><label for="pp-case">Capital letters</label><select id="pp-case" name="capitalize"><option value="none">None</option><option value="first">First letter of each word</option><option value="random">Random words in capitals (adds entropy)</option><option value="all">All capitals</option></select></div>
    <div class="calc-field"><label for="pp-number">Add a digit</label><select id="pp-number" name="number"><option value="no">No</option><option value="yes">Yes, to one random word</option></select></div>
    <div class="calc-field"><label for="pp-count">How many passphrases (1 to 50)</label><input id="pp-count" name="count" inputmode="numeric" value="1" autocomplete="off"></div>
  </div>
