<form class="calc-form" novalidate>
  <div class="calc-field calc-currency"><label for="calc-currency">Currency</label><select id="calc-currency" name="currency" aria-describedby="calc-currency-note"><option value="USD">USD</option><option value="EUR">EUR</option><option value="GBP">GBP</option><option value="CAD">CAD</option><option value="AUD">AUD</option></select><p id="calc-currency-note" class="calc-hint">Changes the displayed symbol only. It does not convert currencies.</p></div>
  <div class="calc-grid"><div class="calc-field"><label for="wa-volume">Items processed per month</label><input id="wa-volume" name="volume" inputmode="decimal" autocomplete="off"><p class="calc-hint">Invoices, tickets, orders or requests.</p></div><div class="calc-field"><label for="wa-minutes">Manual minutes per item</label><input id="wa-minutes" name="minutes" inputmode="decimal" autocomplete="off"></div><div class="calc-field"><label for="wa-rate">Loaded hourly cost</label><input id="wa-rate" name="rate" inputmode="decimal" autocomplete="off"><p class="calc-hint">Pay plus taxes, benefits and overhead.</p></div><div class="calc-field"><label for="wa-auto">Share that can be automated (%)</label><input id="wa-auto" name="auto" data-slider="0,100,5" inputmode="decimal" autocomplete="off"></div></div>
  <details class="calc-more" open><summary>Exceptions and errors</summary>
    <div class="calc-grid"><div class="calc-field"><label for="wa-exc">Exception rate (%)</label><input id="wa-exc" name="exc" data-slider="0,100,1" inputmode="decimal" autocomplete="off"><p class="calc-hint">Automated items that still need a person.</p></div><div class="calc-field"><label for="wa-excmin">Minutes per exception</label><input id="wa-excmin" name="excmin" inputmode="decimal" autocomplete="off"></div><div class="calc-field"><label for="wa-err">Current error rate (%)</label><input id="wa-err" name="err" data-slider="0,50,0.5" inputmode="decimal" autocomplete="off"></div><div class="calc-field"><label for="wa-errcost">Cost to fix one error</label><input id="wa-errcost" name="errcost" inputmode="decimal" autocomplete="off"></div><div class="calc-field"><label for="wa-errcut">Errors removed by automation (%)</label><input id="wa-errcut" name="errcut" data-slider="0,100,5" inputmode="decimal" autocomplete="off"></div></div>
  </details>
  <details class="calc-more" open><summary>Costs and time frame</summary>
    <div class="calc-grid"><div class="calc-field"><label for="wa-soft">Software per year</label><input id="wa-soft" name="soft" inputmode="decimal" autocomplete="off"></div><div class="calc-field"><label for="wa-impl">Implementation, integration and training (one-time)</label><input id="wa-impl" name="impl" inputmode="decimal" autocomplete="off"></div><div class="calc-field"><label for="wa-maint">Maintenance per year</label><input id="wa-maint" name="maint" inputmode="decimal" autocomplete="off"><p class="calc-hint">Fixing broken flows, updates and monitoring.</p></div><div class="calc-field"><label for="wa-ramp">Ramp-up period (months)</label><input id="wa-ramp" name="ramp" data-slider="0,12,1" inputmode="decimal" autocomplete="off"></div><div class="calc-field"><label for="wa-years">Analysis period (years)</label><input id="wa-years" name="years" data-slider="1,5,1" inputmode="decimal" autocomplete="off"></div></div>
  </details>
