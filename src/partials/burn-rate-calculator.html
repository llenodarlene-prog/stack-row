<form class="calc-form" novalidate>
  <div class="calc-field calc-currency"><label for="calc-currency">Currency</label><select id="calc-currency" name="currency" aria-describedby="calc-currency-note"><option value="USD">USD</option><option value="EUR">EUR</option><option value="GBP">GBP</option><option value="CAD">CAD</option><option value="AUD">AUD</option></select><p id="calc-currency-note" class="calc-hint">Changes the displayed symbol only. It does not convert currencies.</p></div>
  <div class="calc-grid"><div class="calc-field"><label for="br-cash">Cash in the bank</label><input id="br-cash" name="cash" inputmode="decimal" autocomplete="off"></div><div class="calc-field"><label for="br-exp">Monthly operating expenses (gross burn)</label><input id="br-exp" name="expenses" inputmode="decimal" autocomplete="off"></div><div class="calc-field"><label for="br-rev">Monthly revenue</label><input id="br-rev" name="revenue" inputmode="decimal" autocomplete="off"><p class="calc-hint">Cash collected from customers each month. Leave blank if none.</p></div></div>
  <details class="calc-more"><summary>Growth assumptions (optional)</summary>
    <div class="calc-grid"><div class="calc-field"><label for="br-revg">Monthly revenue growth (%)</label><input id="br-revg" name="revgrowth" data-slider="-20,30,0.5" inputmode="decimal" autocomplete="off"></div><div class="calc-field"><label for="br-expg">Monthly expense growth (%)</label><input id="br-expg" name="expgrowth" data-slider="-20,30,0.5" inputmode="decimal" autocomplete="off"></div></div>
  </details>
