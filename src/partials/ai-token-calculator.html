<form class="calc-form" novalidate>
  <div class="calc-field">
    <label for="tk-text">Paste a prompt or document (optional)</label>
    <textarea id="tk-text" name="text" rows="6" maxlength="2000000" aria-describedby="tk-text-note"></textarea>
    <p class="calc-hint" id="tk-text-note">Counted in your browser only. Text is never uploaded, saved, or added to share links.</p>
  </div>
  <div class="calc-field"><label for="tk-file">Or load a text file (.txt, .md, .csv, .json)</label><input id="tk-file" type="file" accept=".txt,.md,.csv,.json,.html,.xml,text/*"></div>
  <div class="calc-grid">
    <div class="calc-field"><label for="tk-in">Input tokens per request</label><input id="tk-in" name="input" inputmode="numeric" autocomplete="off" aria-describedby="tk-in-note"><p class="calc-hint" id="tk-in-note">Filled from the text above, or type an exact count.</p></div>
    <div class="calc-field"><label for="tk-out">Output tokens per request</label><input id="tk-out" name="output" inputmode="numeric" autocomplete="off"></div>
    <div class="calc-field"><label for="tk-req">Requests per month</label><input id="tk-req" name="requests" inputmode="numeric" autocomplete="off" placeholder="1"></div>
    <div class="calc-field"><label for="tk-cache">Share of input from cache (%)</label><input id="tk-cache" name="cached" inputmode="decimal" autocomplete="off" placeholder="0"></div>
  </div>
